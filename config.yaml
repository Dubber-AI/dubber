translator:
  provider: openrouter
  model: openai/gpt-oss-120b:free
  batch_size: 50
  max_retries: 5
  base_delay: 1.0
  timeout: 120

tts:
  provider: local
  voice: Microsoft Irina Desktop - Russian
  max_concurrent: 2
  # provider: edge
  # voice: ru-RU-DmitryNeural
  # max_concurrent: 5

processing:
  workers: 8
  output_mode: replace

output:
  directory: ./output

cache:
  enabled: true
  db_path: ./dubber_cache.db
